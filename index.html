<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Image Resizer & Compressor</title>

    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>

<div class="container">

    <div class="card">

        <h1> Image Resizer & Compressor</h1>
        <p class="subtitle">
            Resize & Compress Image from
            <strong>10KB to 1MB</strong>
        </p>

        <!-- Upload -->
        <div class="upload-box" id="dropArea">
            <input type="file" id="imageInput" accept="image/*" hidden>

            <div class="upload-content">
                <div class="upload-icon">📤</div>

                <h3>Drag & Drop Image</h3>

                <p>or</p>

                <button id="browseBtn" class="btn">
                    Browse Image
                </button>

                <small>
                    JPG • PNG • WEBP
                </small>
            </div>
        </div>

        <!-- Preview -->
        <div class="preview-area" id="previewArea">

            <img id="previewImage">

            <div class="image-info">

                <div class="info">
                    <span>Original Size</span>
                    <strong id="originalSize">0 KB</strong>
                </div>

                <div class="info">
                    <span>Resolution</span>
                    <strong id="resolution">
                        0 × 0
                    </strong>
                </div>

            </div>

        </div>

        <!-- Controls -->
        <div class="controls">

            <div class="row">

                <div class="input-box">
                    <label>Width (px)</label>
                    <input type="number"
                           id="width"
                           placeholder="Width">
                </div>

                <div class="input-box">
                    <label>Height (px)</label>
                    <input type="number"
                           id="height"
                           placeholder="Height">
                </div>

            </div>

            <div class="input-box">

                <label>Quality</label>

                <input
                    type="range"
                    id="quality"
                    min="10"
                    max="100"
                    value="80">

                <span id="qualityValue">
                    80%
                </span>

            </div>

            <div class="input-box">

                <label>Target Size</label>

                <select id="targetSize">

                    <option value="10">10 KB</option>
                    <option value="20">20 KB</option>
                    <option value="30">30 KB</option>
                    <option value="50">50 KB</option>
                    <option value="100">100 KB</option>
                    <option value="150">150 KB</option>
                    <option value="200">200 KB</option>
                    <option value="300">300 KB</option>
                    <option value="500">500 KB</option>
                    <option value="700">700 KB</option>
                    <option value="1024">1 MB</option>

                </select>

            </div>

        </div>

        <!-- Buttons -->
        <div class="buttons">

            <button id="compressBtn" class="primary-btn">
                Compress Image
            </button>

            <button id="downloadBtn"
                    class="download-btn"
                    disabled>

                Download Image

            </button>

        </div>

        <!-- Progress -->
        <div class="progress-box">

            <div class="progress">
                <div class="progress-bar"
                     id="progressBar">
                </div>
            </div>

            <span id="progressText">
                Waiting...
            </span>

        </div>

        <!-- Result -->
        <div class="result">

            <div class="result-box">

                <h3>Compression Result</h3>

                <div class="result-item">
                    <span>Original</span>
                    <strong id="oldSize">
                        0 KB
                    </strong>
                </div>

                <div class="result-item">
                    <span>Compressed</span>
                    <strong id="newSize">
                        0 KB
                    </strong>
                </div>

                <div class="result-item">
                    <span>Saved</span>
                    <strong id="savedPercent">
                        0%
                    </strong>
                </div>

            </div>

        </div>

    </div>

</div>

<script src="script.js"></script>
<footer class="footer">
    <div class="footer-content">
        Designed & Developed by
        <strong>Injmam Ali ❤️</strong>
    ©2026</div>

    <button id="topBtn" onclick="window.scrollTo({top:0,behavior:'smooth'})">
        ↑
    </button>
</footer>


</body>
</html>
